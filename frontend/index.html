<html lang="en">

    <script>
      // The saved light/dark choice, applied before the first paint (no flash of the other theme).

        if (localStorage.getItem('medifed-theme') === 'light') document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>

    />

  </body>
